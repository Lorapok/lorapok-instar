name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install System Dependencies for Native Modules
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libarchive-tools

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Production Bundle Build
        run: npm run build
