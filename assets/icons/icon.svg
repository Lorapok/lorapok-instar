<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29" />
      <stop offset="50%" stop-color="#2c0b38" />
      <stop offset="100%" stop-color="#0b0814" />
    </linearGradient>
    <linearGradient id="cocoonGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#ff7f50" />
      <stop offset="35%" stop-color="#e95420" />
      <stop offset="70%" stop-color="#77216f" />
      <stop offset="100%" stop-color="#2c001e" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ffd5b8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#e95420" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#e95420" flood-opacity="0.35" />
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#ffffff" flood-opacity="0.4" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#3c204d" stroke-width="4" filter="url(#shadowFilter)" />

  <!-- Sensory Cocoon Outer Shell -->
  <path d="M 256 76 C 354 76 414 156 414 266 C 414 366 344 436 256 436 C 168 436 98 366 98 266 C 98 156 158 76 256 76 Z"
        fill="url(#cocoonGrad)"
        opacity="0.95" />

  <!-- Overlapping Bio-Sash Rings -->
  <path d="M 128 210 Q 256 150 384 210 Q 256 270 128 210 Z" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="3" />
  <path d="M 112 270 Q 256 210 400 270 Q 256 330 112 270 Z" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" />
  <path d="M 136 330 Q 256 280 376 330 Q 256 380 136 330 Z" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3" />

  <!-- Inner Instar Nucleus -->
  <ellipse cx="256" cy="266" rx="64" ry="94" fill="url(#coreGlow)" filter="url(#innerGlow)" />

  <!-- Kinetic Lightning / Spark Core -->
  <polygon points="256,190 274,250 250,250 262,310 236,256 258,256" fill="#180e29" opacity="0.9" />

  <!-- Tactile Rim Accent -->
  <circle cx="256" cy="116" r="6" fill="#ffffff" opacity="0.9" />
  <circle cx="340" cy="180" r="4" fill="#ff7f50" opacity="0.8" />
  <circle cx="172" cy="180" r="4" fill="#ffd5b8" opacity="0.8" />
</svg>
