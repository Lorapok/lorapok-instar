appId: com.lorapok.instar
productName: Lorapok Instar
executableName: instar
copyright: Copyright © 2026 Lorapok Labs

directories:
  output: dist-packages
  buildResources: assets

files:
  - out/**/*
  - assets/**/*
  - package.json

asarUnpack:
  - "**/node_modules/better-sqlite3/**/*"

extraResources:
  - from: assets/icons
    to: icons
  - from: assets/services
    to: services

linux:
  target:
    - target: deb
      arch: [x64, arm64]
    - target: AppImage
      arch: [x64, arm64]
    - target: tar.zst
      arch: [x64]
  category: Network;InstantMessaging;Office
  maintainer: Lorapok Labs <contact@lorapok.tech>
  synopsis: Systems-grade, low-RAM, sandboxed multi-account workspace
  description: High-throughput, zero-leakage multi-account workspace for WhatsApp, Telegram, Discord, Slack, and social platforms with hardware acceleration and audio-aware hibernation on Ubuntu and Linux desktops.
  icon: assets/icons
  desktop:
    Name: Lorapok Instar
    Comment: Sandboxed Multi-Account Social & Messaging Workspace
    GenericName: Social Workspace
    Keywords: whatsapp;facebook;instagram;telegram;discord;social;cocoon;lorapok;
    StartupWMClass: Lorapok Instar
    MimeType: x-scheme-handler/instar;
    Terminal: false

deb:
  depends:
    - libnotify4
    - libsecret-1-0
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libayatana-appindicator3-1
  afterInstall: scripts/linux-postinstall.sh
  afterRemove: scripts/linux-postremove.sh

appImage:
  license: LICENSE
