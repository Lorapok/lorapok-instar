appId: tech.lorapok.instar
productName: Lorapok Instar
executableName: lorapok-instar

directories:
  output: release
  buildResources: assets

files:
  - out/**/*
  - assets/**/*
  - package.json

extraResources:
  - from: assets/icons
    to: icons
  - from: assets/services
    to: services

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: tar.zst
      arch:
        - x64
  category: Network;Chat;InstantMessaging;Office;
  maintainer: Lorapok Labs <contact@lorapok.tech>
  synopsis: Systems-grade, low-RAM, sandboxed multi-account workspace
  description: High-throughput, zero-leakage multi-account workspace for WhatsApp, Telegram, Discord, Slack, and social platforms with hardware acceleration and audio-aware hibernation on Ubuntu and Linux desktops.
  icon: assets/icons/icon.png
  desktop:
    Name: Lorapok Instar
    Comment: Sandboxed Multi-Account Workspace
    GenericName: Internet Messenger Workspace
    Categories: Network;Chat;InstantMessaging;Office;
    StartupWMClass: lorapok-instar
    MimeType: x-scheme-handler/instar;
    Terminal: false
    Keywords: chat;messaging;whatsapp;telegram;discord;slack;workspace;multi-account;

deb:
  depends:
    - libsecret-1-0
    - libnotify4
    - libnss3
    - libatk1.0-0
    - libatk-bridge2.0-0
    - libcups2
    - libdrm2
    - libgtk-3-0
    - libgbm1
    - libasound2t64 | libasound2
  afterInstall: scripts/linux-postinstall.sh

appImage:
  license: LICENSE
